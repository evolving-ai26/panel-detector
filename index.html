<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">Panel Detector</span>
  </div>
  <nav class="topbar-links">
    <span class="status-pill">
      <span class="dot"></span> System Ready
    </span>
  </nav>
</header>

<main class="layout">

  <section class="hero">
    <h1>Solar Panel Integrity Check</h1>
    <p>Enter the measured stress, strain and yield strength of a panel to run an instant physics &amp; ML‑based structural assessment.</p>
  </section>

  <section class="panel-card">
    <form id="panel-form" novalidate>
      <div class="field">
        <label for="stress">Stress <span class="unit">(MPa)</span></label>
        <input type="number" id="stress" name="stress" step="any" placeholder="e.g. 188" required>
        <span class="error-msg" id="err-stress"></span>
      </div>

      <div class="field">
        <label for="strain">Strain <span class="unit">(mm/mm)</span></label>
        <input type="number" id="strain" name="strain" step="any" placeholder="e.g. 0.38" required>
        <span class="error-msg" id="err-strain"></span>
      </div>

      <div class="field">
        <label for="yield_strength">Yield Strength <span class="unit">(MPa)</span></label>
        <input type="number" id="yield_strength" name="yield_strength" step="any" placeholder="e.g. 191" required>
        <span class="error-msg" id="err-yield"></span>
      </div>

      <button type="submit" id="submit-btn">
        <span class="btn-label">Run Diagnostic</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>
  </section>

  <section class="result-card" id="result-card" hidden>
    <div class="result-icon" id="result-icon"></div>
    <div class="result-body">
      <h2 id="result-title"></h2>
      <p id="result-subtitle"></p>
      <dl class="result-details" id="result-details"></dl>
    </div>
  </section>

  <section class="history-card" id="history-card" hidden>
    <div class="history-head">
      <h3>Recent Checks</h3>
      <button id="clear-history" type="button">Clear</button>
    </div>
    <ul id="history-list"></ul>
  </section>

</main>

<footer class="footer">
  <p>Panel Detector &middot; Structural Health Diagnostics</p>
</footer>

<script src="script.js"></script>
</body>
</html>
